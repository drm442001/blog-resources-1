<!-- Prompt Library Engine v2.4 -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Library Engine</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f1220;color:#e8eaf2;line-height:1.55;padding:22px 14px 90px}
  .wrap{max-width:960px;margin:0 auto}
  header{text-align:center;margin-bottom:18px}
  header h1{font-size:25px;font-weight:800;background:linear-gradient(90deg,#7c9cff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:#9aa3b8;font-size:13px;margin-top:6px}
  .uploader{background:#151932;border:1px solid #262c48;border-radius:16px;padding:18px;margin-bottom:18px}
  .dropzone{border:2px dashed #3a4470;border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;transition:.2s}
  .dropzone:hover,.dropzone.drag{border-color:#7c9cff;background:#12172f}
  .dropzone .big{font-size:34px}
  .dropzone .t{font-size:15px;font-weight:600;margin-top:6px}
  .dropzone .s{font-size:12.5px;color:#9aa3b8;margin-top:4px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;justify-content:center}
  .btn{background:#232a4d;color:#cdd5f5;border:1px solid #35406e;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn:hover{background:#2e3763;border-color:#4a58a0}
  .btn-main{background:linear-gradient(135deg,#7c9cff,#c084fc);color:#0f1220;border:none}
  .btn-main:hover{filter:brightness(1.08)}
  .btn-red{background:#c41d00;border-color:#a01700;color:#fff}
  .btn-red:hover{background:#a01700}
  details.paste{margin-top:12px}
  details.paste summary{cursor:pointer;font-size:13px;color:#8fa0d8;font-weight:600;user-select:none}
  details.paste textarea{width:100%;height:150px;margin-top:8px;border-radius:10px;border:1px solid #2a2f45;background:#101427;color:#e8eaf2;font-family:ui-monospace,monospace;font-size:12.5px;padding:10px;resize:vertical}
  .notice{margin-top:12px;padding:10px 13px;border-radius:10px;font-size:13px;display:none}
  .notice.warn{background:#3a2a10;border:1px solid #7a5a20;color:#ffcf87;display:block}
  .notice.err{background:#3a1414;border:1px solid #7a2020;color:#ff9b9b;display:block}
  .notice ul{margin:6px 0 0 18px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{background:#171b2e;border:1px solid #2a2f45;border-radius:20px;padding:7px 15px;font-size:13px;font-weight:600;cursor:pointer;color:#cdd5f5;transition:.15s;display:flex;align-items:center;gap:7px}
  .tab:hover{border-color:#4a58a0}
  .tab.active{background:linear-gradient(135deg,#7c9cff,#c084fc);color:#0f1220;border:none}
  .tab .x{opacity:.6;font-weight:800}
  .tab .x:hover{opacity:1}
  .tab .cnt{font-size:11px;background:rgba(0,0,0,.18);padding:1px 7px;border-radius:10px}
  .cat-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .cat-title{font-size:19px;font-weight:800}
  .cat-actions{display:flex;gap:8px;flex-wrap:wrap}
  .searchbar{position:sticky;top:0;z-index:20;background:#0f1220;padding:10px 0;margin-bottom:12px}
  .searchbar input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid #2a2f45;background:#171b2e;color:#e8eaf2;font-size:15px;outline:none}
  .searchbar input:focus{border-color:#7c9cff}
  .count{font-size:12px;color:#9aa3b8;margin-top:6px;text-align:right}
  .card{background:#151932;border:1px solid #262c48;border-radius:16px;padding:18px;margin-bottom:20px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .num{background:linear-gradient(135deg,#7c9cff,#c084fc);color:#0f1220;font-weight:800;font-size:14px;padding:4px 11px;border-radius:20px}
  .ptitle{font-size:18px;font-weight:700;flex:1;min-width:180px}
  .sec{background:#101427;border:1px solid #242a44;border-radius:11px;padding:11px 13px;margin-bottom:11px}
  .sec-body{border-color:#3a4470;background:#12172f}
  .bip-card{background:#ff2400;border-color:#ff2400}
  .bip-card .lab{color:#fff}
  .bip-card .val{color:#fff}
  .bip-card .cbtn{background:#c41d00;border-color:#a01700;color:#fff}
  .bip-card .cbtn:hover{background:#a01700;border-color:#801200}
  .bip-card .cbtn.copied{background:#1e7d54;border-color:#25a06c;color:#fff}
  .sec-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
  .lab{font-size:12px;font-weight:700;color:#8fa0d8;letter-spacing:.3px;text-transform:uppercase}
  .lab em{font-weight:500;text-transform:none;color:#9aa3b8}
  .cbtn{background:#232a4d;color:#cdd5f5;border:1px solid #35406e;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .cbtn:hover{background:#2e3763;border-color:#4a58a0}
  .cbtn.copied{background:#1e7d54;border-color:#25a06c;color:#fff}
  .cbtn-main{background:linear-gradient(135deg,#7c9cff,#c084fc);color:#0f1220;border:none}
  .cbtn-main:hover{filter:brightness(1.08)}
  .cbtn-main.copied{background:#1e7d54;color:#fff}
  .cbtn-special{background:#5a4fc0;color:#fff;border-color:#4a3fc0}
  .cbtn-special:hover{background:#6a5fd4;border-color:#5a4fc0}
  .cbtn-special.copied{background:#1e7d54;border-color:#25a06c;color:#fff}
  .val{font-size:13.5px;color:#d3d9ee;white-space:pre-wrap;word-break:break-word}
  .val.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fe6c1;font-size:13px}
  .body-block .mini-lab{font-size:11.5px;font-weight:800;color:#c084fc;text-transform:uppercase;margin:9px 0 3px}
  .body-block .mini-lab:first-child{margin-top:0}
  .alt-warn{color:#ff6b35;font-size:12px;background:#fff3ec;border-left:3px solid #ff6b35;padding:4px 8px;margin-top:4px;border-radius:4px}
  .preset-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .preset-row label{font-size:12px;font-weight:700;color:#8fa0d8;letter-spacing:.3px;text-transform:uppercase}
  .stylePreset{background:#232a4d;color:#cdd5f5;border:1px solid #35406e;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;outline:none;transition:.15s}
  .stylePreset:hover,.stylePreset:focus{background:#2e3763;border-color:#4a58a0}
  .howto{margin:2px 0 0 18px;font-size:13px;color:#d3d9ee}
  .howto li{margin-bottom:3px}
  .no-result{text-align:center;color:#9aa3b8;padding:40px;display:none}
  .empty{text-align:center;color:#6c7492;padding:50px 20px}
  footer{text-align:center;color:#6c7492;font-size:12px;margin-top:30px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e7d54;color:#fff;padding:11px 22px;border-radius:30px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .icon-svg{width:14px;height:14px;fill:currentColor;display:inline-block;vertical-align:middle}
  .icon-svg-small{width:12px;height:12px;fill:currentColor;display:inline-block;vertical-align:middle}
  .body-block-scroll{max-height:280px;overflow-y:auto}
  .body-block-scroll .val{white-space:pre-wrap;word-break:break-word}
  .dropdown-container{display:inline-flex;position:relative}
  .dropdown-content{display:none;position:absolute;background:#171b2e;border:1px solid #2a2f45;border-radius:8px;min-width:160px;z-index:1000;top:100%;left:0;margin-top:4px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
  .dropdown-content.show{display:block}
  .dropdown-option{padding:8px 12px;font-size:12px;color:#cdd5f5;cursor:pointer;transition:.15s;border-radius:6px}
  .dropdown-option:hover{background:#232a4d;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prompt Library Engine</h1>
    <p>Upload any prompt-library <b>.md</b> file &rarr; copy-ready Blogger cards.</p>
  </header>

  <div class="uploader">
    <div class="dropzone" id="dropzone">
      <div class="big"><svg class="icon-svg" viewBox="0 0 24 24" style="width:34px;height:34px;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg></div>
      <div class="t">Drag &amp; drop your .md file here</div>
      <div class="s">or click to browse &mdash; you can add multiple category files</div>
    </div>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple style="display:none">
    <div class="row">
      <button class="btn btn-main" id="browseBtn"><svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Choose .md file(s)</button>
      <button class="btn" id="templateBtn"><svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 2 2h8c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg> Download template</button>
      <button class="btn btn-red" id="clearBtn"><svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg> Clear all</button>
    </div>
    <details class="paste">
      <summary><svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg> or paste .md content directly</summary>
      <textarea id="pasteArea" placeholder="Paste the full .md content here..."></textarea>
      <div class="row" style="justify-content:flex-start">
        <input class="btn" id="pasteName" placeholder="Category name (optional)" style="background:#101427;color:#e8eaf2">
        <button class="btn btn-main" id="pasteBtn"><svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Load pasted content</button>
      </div>
    </details>
    <div class="notice" id="notice"></div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="catArea"></div>
  <footer>Prompt Library Engine &middot; buttons copy exactly the highlighted section.</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

var libraries=[], activeIdx=-1, lastCopiedBtn=null, srcStore={}, promptStore={}, uid=0;

function el(id){return document.getElementById(id);}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

var toast=el('toast'),toastT;
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toast.classList.remove('show');},1400);}

function resetBtn(b){
  if(!b)return;
  if(b.getAttribute('data-orig')!==null){b.innerHTML=b.getAttribute('data-orig');}
  b.classList.remove('copied');
}

function doCopy(text,btn){
  if(btn.getAttribute('data-orig')===null){btn.setAttribute('data-orig',btn.innerHTML);}
  function ok(){
    if(lastCopiedBtn&&lastCopiedBtn!==btn){resetBtn(lastCopiedBtn);}
    btn.classList.add('copied');
    btn.innerHTML='<svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg> Copied';
    lastCopiedBtn=btn;showToast('Copied!');
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(function(){fallback(text,ok);});
  }else{fallback(text,ok);}
}

function fallback(text,ok){
  var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');ok();}catch(e){alert('Copy failed');}
  document.body.removeChild(ta);
}

window.copyBeforeTitle = function(btn, num, title) {
  doCopy(num + ' ' + title + ' Before.jpg', btn);
};

window.copyAfterTitle = function(btn, num, title) {
  doCopy(num + ' ' + title + ' After.jpg', btn);
};

window.copyThumbnailTitle = function(btn, num, title, suffix) {
  doCopy(num + ' ' + title + suffix, btn);
};

window.copyThumbnailTitleFromDropdown = function(option, suffix) {
  var dropdownBtn = option.closest('.dropdown-container').querySelector('.cbtn-special');
  var num = dropdownBtn.getAttribute('data-prompt-num');
  var title = dropdownBtn.getAttribute('data-prompt-title');
  
  // Close the dropdown
  var dropdown = option.closest('.dropdown-content');
  dropdown.style.display = 'none';
  
  // Copy the text
  copyThumbnailTitle(dropdownBtn, num, title, suffix);
};

window.toggleThumbnailDropdown = function(dropdownId) {
  var dropdown = document.getElementById('dropdown-' + dropdownId);
  document.querySelectorAll('.dropdown-content').forEach(function(d) {
    if (d !== dropdown) d.style.display = 'none';
  });
  if (dropdown.style.display === 'block') {
    dropdown.style.display = 'none';
  } else {
    dropdown.style.display = 'block';
    setTimeout(function() {
      document.addEventListener('click', function closeDropdown(e) {
        if (!e.target.closest('.dropdown-container') && !e.target.closest('.dropdown-content')) {
          dropdown.style.display = 'none';
          document.removeEventListener('click', closeDropdown);
        }
      });
    }, 10);
  }
};

window.copyPromptNegativeOnly=function(btn){
  btn=btn||((window.event&&window.event.target)?window.event.target:null);
  var scope=(btn&&btn.closest)?(btn.closest('.card')||document):document;
  var promptEl=scope.querySelector('[data-field="prompt"]');
  var negativeEl=scope.querySelector('[data-field="negative"]');
  var promptText=promptEl?promptEl.innerText.trim():'';
  var negativeText=negativeEl?negativeEl.innerText.trim():'';
  var combined='';
  if(promptText)combined+=promptText;
  if(negativeText)combined+='\n\nNEGATIVE PROMPT:\n'+negativeText;
  if(!combined.trim()){alert('No prompt text found!');return;}
  doCopy(combined, btn);
};

function stripBullets(t){
  return (t||'').split('\n').map(function(l){return l.replace(/^\s*[-*]\s+/,'').replace(/\*\*/g,'').trim();}).filter(function(l){return l.length;}).join('\n');
}

function cleanInline(t){return (t||'').replace(/\*\*/g,'').replace(/`/g,'').trim();}

var FIELD_MAP=[
  {k:'title',   re:/^(\d+\s*[·.\-–—)]*\s*)?prompt\s*title/i},
  {k:'title',   re:/\b1\s*[·.]\s*POST\s*TITLE\b/i},
  {k:'title',   re:/\bPOST\s+TITLE\b/i},
  {k:'before',  re:/before\s*image\s*prompt/i},
  {k:'altThumb',re:/\b4\s*[·.]\s*ALT\s*TEXT.*THUMBNAIL/i},
  {k:'altThumb',re:/ALT\s*TEXT.*THUMBNAIL(\s*IMAGE)?/i},
  {k:'altThumb',re:/\bALT.*THUMB/i},
  {k:'altpair', re:/\b5\s*[·.]\s*ALT\s*TEXT.*BEFORE/i},
  {k:'altpair', re:/ALT\s*TEXT.*BEFORE.*AFTER/i},
  {k:'altAfter',re:/after\s*image.*alt\s*text/i},
  {k:'altBefore',re:/before\s*image.*alt\s*text/i},
  {k:'negative',re:/negative\s*prompt/i},
  {k:'howto',   re:/how\s*to\s*use\s*this\s*prompt/i},
  {k:'intro',   re:/introduction/i},
  {k:'tools',   re:/compatible\s+ai\s+tools/i},
  {k:'tools',   re:/recommended\s+ai\s+tools/i},
  {k:'expected',re:/^(\d+\s*[·.\-–—)]*\s*)?expected\s+(output|result)/i},
  {k:'tips',    re:/tips?\s*(&|and)\s*variations?/i},
  {k:'howto',   re:/^(\d+\s*[·.\-–—)]*\s*)?how\s*to\s*use\b/i},
  {k:'labels',  re:/labels/i},
  {k:'permalink',re:/permalink/i},
  {k:'search',  re:/search\s*description/i},
  {k:'thumb',   re:/\b10\s*[·.]\s*THUMBNAIL.*PROMPT/i},
  {k:'thumb',   re:/THUMBNAIL.*GENERATOR.*PROMPT/i},
  {k:'thumb',   re:/THUMBNAIL.*IMAGE.*GENERATOR/i},
  {k:'prompt',  re:/^(\d+\s*[·.\-–—)]*\s*)?prompt\b/i}
];

function classifyHeading(h){
  var s=h.replace(/[:*`]/g,'').trim();
  for(var i=0;i<FIELD_MAP.length;i++){ if(FIELD_MAP[i].re.test(s)) return FIELD_MAP[i].k; }
  return null;
}

function parseMarkdown(md){
  var lines=md.replace(/\r/g,'').split('\n');
  var catName='Prompt Library';
  for(var i=0;i<lines.length;i++){
    var mh=lines[i].match(/^#\s+(.*)/);
    if(mh){catName=cleanInline(mh[1]);break;}
  }
  var prompts=[];
  var blockRe=/^##\s+Prompt\s*#?\s*(\d+)/i;
  var idxs=[];
  for(var j=0;j<lines.length;j++){ if(blockRe.test(lines[j])) idxs.push(j); }
  if(!idxs.length) return {name:catName,prompts:[],error:'No "## Prompt #N" blocks found.'};
  for(var b=0;b<idxs.length;b++){
    var start=idxs[b], end=(b+1<idxs.length)?idxs[b+1]:lines.length;
    var num=(lines[start].match(blockRe)||[])[1]||String(b+1);
    var body=lines.slice(start+1,end);
    var fields={}, curKey=null, buf=[];
    function flush(){ if(curKey){fields[curKey]=(fields[curKey]?fields[curKey]+'\n':'')+buf.join('\n').trim();} buf=[]; }
    for(var r=0;r<body.length;r++){
      var line=body[r];
      if(/^[\=\-]{3,}\s*$/.test(line.trim())) continue;
      if(/^---\s*$/.test(line)) continue;
      if(/^\s*##\s+(frequently asked questions|faq)/i.test(line)){ flush(); curKey='howto'; buf.push(line); continue; }
      var mAltB=line.match(/^\s*Before\s+Image\s+Alt\s*:\s*(.*)$/i);
      if(mAltB){ flush(); curKey='altBefore'; if(mAltB[1].trim())buf.push(mAltB[1].trim()); continue; }
      var mAltA=line.match(/^\s*After\s+Image\s+Alt\s*:\s*(.*)$/i);
      if(mAltA){ flush(); curKey='altAfter'; if(mAltA[1].trim())buf.push(mAltA[1].trim()); continue; }
      var head=null, m1=line.match(/^\s*\*\*(.+?)\*\*\s*:?\s*$/), m2=line.match(/^\s*#{3,}\s*(.+?)\s*$/);
      if(m1){head=m1[1];}
      if(head!==null){var key=classifyHeading(head);if(key){ flush(); curKey=key; continue; }}
      if(m2){var subKey=classifyHeading(m2[1]);if(subKey){ flush(); curKey=subKey; }else if(curKey==='tools'||curKey==='expected'||curKey==='tips'){ flush(); curKey='howto'; }continue;}
      buf.push(line);
    }
    flush();
    prompts.push({
      num:num, title:cleanInline(fields.title||''), intro:cleanInline(fields.intro||''),
      before:cleanInline(fields.before||''), altThumb:cleanInline(fields.altThumb||''),
      altAfter:cleanInline(fields.altAfter||''), altBefore:cleanInline(fields.altBefore||''),
      prompt:cleanInline(fields.prompt||''), negative:cleanInline(fields.negative||''),
      tools:stripBullets(fields.tools||''), howto:stripBullets(fields.howto||''),
      expected:stripBullets(fields.expected||''), tips:stripBullets(fields.tips||''),
      thumb:cleanInline(fields.thumb||''), labels:cleanInline(fields.labels||''),
      permalink:cleanInline((fields.permalink||'').replace(/`/g,'')), search:cleanInline(fields.search||'')
    });
  }
  return {name:catName,prompts:prompts};
}

function checkLibrary(lib){
  var problems=[];
  var need=['title','intro','before','altAfter','altBefore','prompt','negative','tools','howto','labels','permalink','search'];
  var nice={title:'Prompt Title',intro:'Introduction',before:'Before Image Prompt',altAfter:'After Image Alt text',altBefore:'Before Image Alt text',prompt:'Prompt',negative:'Negative Prompt',tools:'Compatible AI Tools',howto:'How To Use This Prompt',labels:'Labels',permalink:'Permalink',search:'Search Description'};
  lib.prompts.forEach(function(p){var miss=need.filter(function(k){return !p[k];});if(miss.length){ problems.push('Prompt #'+p.num+': missing '+miss.map(function(k){return nice[k];}).join(', ')); }});
  return problems;
}

function howtoHTML(h){var lines=(h||'').split('\n').filter(function(l){return l.trim();});return '<ul class="howto">'+lines.map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>';}

function fullBody(p){
  var parts=[];
  if(p.intro)parts.push(p.intro);
  parts.push('PROMPT:\n'+p.prompt);
  parts.push('NEGATIVE PROMPT:\n'+p.negative);
  if(p.tools)parts.push('COMPATIBLE AI TOOLS:\n'+p.tools);
  if(p.howto)parts.push('HOW TO USE THIS PROMPT:\n'+p.howto);
  if(p.expected)parts.push('EXPECTED OUTPUT:\n'+p.expected);
  if(p.tips)parts.push('TIPS & VARIATIONS:\n'+p.tips);
  return parts.join('\n\n');
}

function promptNegativeBody(p){return (p.prompt||'')+(p.negative?'\n\nNEGATIVE PROMPT:\n'+p.negative:'');}

    body+='<p class="mini-lab">Negative Prompt</p><div class="val" data-field="negative">'+esc(p.negative)+'</div>';
    if(p.tools) body+='<p class="mini-lab">Compatible AI Tools</p><div class="val">'+esc(p.tools)+'</div>';

    if(p.tips) body+='<p class="mini-lab">Tips &amp; Variations</p><div class="val">'+esc(p.tips)+'</div>';

      +'<div class="card-head"><span class="num">#'+esc(p.num)+'</span><h2 class="ptitle">'+esc(p.title)+'</h2><button class="cbtn cbtn-main" data-copytext="'+esc(allSettings(p))+'">Copy All Settings</button></div>';

      +sec('2 · Before Image Prompt',p.before,'bip-card');

      +sec('4 · Before Image - Alt text',p.altBefore,null,false,validateAlt(p.altBefore));
      +sec('5 · After Image - Alt text',p.altAfter,null,false,validateAlt(p.altAfter));
      +body;
      +sec('7 · Labels (SEO)',p.labels,null,false,validateLabels(p.labels));
      +sec('8 · Permalink',p.permalink,null,true,validatePermalink(p.permalink));
      +sec('9 · Search Description',p.search,null,false,validateSearchDesc(p.search));
      +'<div class="sec"><div class="sec-top"><span class="lab">10 · Thumbnail Image Generator Prompt</span><button class="cbtn" data-copytext="'+esc(thumbPrompt)+'">'+svgCopy+' Copy Thumbnail Prompt</button></div><div class="preset-row"><label>Style Preset:</label><select class="stylePreset" data-title="'+esc(p.title)+'" data-labels="'+esc(p.labels)+'">'+presetOptionsHTML(expPreset)+'</select></div><textarea readonly class="val thumbnailPrompt" style="width:100%;min-height:300px;overflow:auto;background:transparent;border:1px dashed #242a44;border-radius:8px;padding:8px;resize:vertical;font:inherit;color:#d3d9ee">'+esc(thumbPrompt)+'</textarea></div></article>';
  }).join('\n');
  var js='<script>(function(){var last=null,toast=document.getElementById("toast"),tt;';
    js+='function st(m){toast.textContent=m;toast.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove("show");},1400);}';

    js+='function cp(t,b){if(b.getAttribute("data-orig")===null)b.setAttribute("data-orig",b.innerHTML);';
    js+='function ok(){if(last&&last!==b)rb(last);b.classList.add("copied");b.innerHTML=\'<svg class="icon-svg-small" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg> Copied\';last=b;st("Copied!");}';
    js+='if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(function(){fb(t,ok);});}else{fb(t,ok);}}';
    js+='function fb(t,ok){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.left="-9999px";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok();}catch(e){alert("Copy failed");}document.body.removeChild(a);}';
    js+='document.addEventListener("click",function(e){var b=e.target.closest(".cbtn");if(!b)return;var t=b.getAttribute("data-copytext");if(t!==null)cp(t,b);});';
    js+='var s=document.getElementById("search"),cs=document.querySelectorAll(".card"),c=document.getElementById("count"),nr=document.getElementById("noResult");';
    js+='if(s)s.addEventListener("input",function(){var q=this.value.trim().toLowerCase(),n=0;cs.forEach(function(x){var m=!q||x.getAttribute("data-search").indexOf(q)!==-1;x.style.display=m?"":"none";if(m)n++;});c.textContent="Showing "+n+" of "+cs.length+" prompts";nr.style.display=n?"none":"block";});';

    js+='function tp(ti,l,k){var t=TT[k]||TT.studio;var f=xf(l);return t.replace(/\\{\\{PROMPT_TITLE\\}\\}/g,ti).replace(/\\{\\{FEATURE_1\\}\\}/g,f[0]).replace(/\\{\\{FEATURE_2\\}\\}/g,f[1]).replace(/\\{\\{FEATURE_3\\}\\}/g,f[2]);}';
    js+='document.addEventListener("change",function(e){var sel=e.target.closest(".stylePreset");if(!sel)return;';
    js+='try{localStorage.setItem(LSK,sel.value);}catch(err){}';
    js+='var fresh=tp(sel.getAttribute("data-title"),sel.getAttribute("data-labels"),sel.value);';
    js+='var sec=sel.closest(".sec");var ta=sec.querySelector(".thumbnailPrompt");if(ta)ta.value=fresh;';
    js+='var b=sec.querySelector(".cbtn");if(b)b.setAttribute("data-copytext",fresh);});';
    js+='try{var sv=localStorage.getItem(LSK);if(sv&&TT[sv]){document.querySelectorAll(".stylePreset").forEach(function(sel){if(sel.value!==sv){sel.value=sv;sel.dispatchEvent(new Event("change",{bubbles:true}));}});}}catch(err){}';
    js+='})();<\/script>';
  var doc='<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>'+esc(lib.name)+'</title>'+head+'</head><body><div class="wrap"><header><h1>'+esc(lib.name)+'</h1><p>'+lib.prompts.length+' prompts</p></header>';
  doc+='<div class="searchbar"><input type="text" id="search" placeholder="Search by title or label..."><div class="count" id="count">Showing '+lib.prompts.length+' of '+lib.prompts.length+' prompts</div></div>';
  doc+=cardsHtml+'<div class="no-result" id="noResult">No prompts match your search.</div><footer>Generated by Prompt Library Engine.</footer></div><div class="toast" id="toast"></div>'+js+'</body></html>';
  var fname=lib.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'prompt-library';
  download(fname+'.html',doc,'text/html;charset=utf-8');
}

var dz=el('dropzone'),fi=el('fileInput');
el('browseBtn').addEventListener('click',function(){fi.click();});
dz.addEventListener('click',function(){fi.click();});
fi.addEventListener('change',function(){if(fi.files.length){readFiles(fi.files);fi.value='';}});
['dragenter','dragover'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add('drag');});});
['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove('drag');});});
dz.addEventListener('drop',function(e){if(e.dataTransfer.files.length)readFiles(e.dataTransfer.files);});

el('pasteBtn').addEventListener('click',function(){
  var txt=el('pasteArea').value.trim();
  if(!txt){showNotice('err','Paste some .md content first.');return;}
  addLibrary(txt, el('pasteName').value.trim()||null);
  el('pasteArea').value='';el('pasteName').value='';
});

el('templateBtn').addEventListener('click',function(){download('prompt-library-template-v4.0.txt',TEMPLATE);});
el('clearBtn').addEventListener('click',function(){libraries=[];activeIdx=-1;clearNotice();render();});

render();
})();
